:root{
  --paper:#F1EFE6;--paper-dark:#E7E4D6;--ink:#262319;--ink-soft:#4C483D;
  --muted:#8A8677;--stamp:#A5372F;--stamp-dark:#8B2E2E;--mustard:#B07A22;
  --line:#E7E4D7;--card:#FFFFFF;--well:#F6F5EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:460px;padding:16px 16px 46px;}

.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-0.3px;margin:0;}
.brand .tag{font-size:11px;color:var(--muted);}

.crumb{font-size:12px;color:var(--muted);margin-bottom:14px;}
.crumb button{background:none;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:0;cursor:pointer;}
.crumb button:active{color:var(--stamp);}

.btn{font-family:inherit;border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;font-size:11px;padding:14px 20px;width:100%;cursor:pointer;}
.btn:active{background:#000;}
.btn:disabled{opacity:0.4;}
.btn.ghost{background:#EDEBDF;color:#5B584C;}
.btn.ghost:active{background:#E3E0D2;color:var(--ink);}
.btn.danger{background:var(--stamp);}
.btn.danger:active{background:var(--stamp-dark);}
.btn-row{display:flex;gap:8px;}

.card,.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(38,35,25,.04),0 8px 22px rgba(38,35,25,.05);}
.tile{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:22px 18px;margin-bottom:12px;font-family:inherit;cursor:pointer;}
.tile:active{background:#FBFAF4;}
.tile-title{font-size:20px;font-weight:800;color:var(--ink);}
.tile-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.tile-count{font-size:12px;font-weight:700;color:var(--stamp);margin-top:4px;}
.chev{color:var(--muted);font-size:18px;}

.card{padding:16px 16px;margin-bottom:12px;}
.section-label{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 10px 2px;}
.screen-title{font-size:22px;font-weight:800;letter-spacing:-0.3px;margin:0 0 4px;}
.screen-sub{font-size:13px;color:var(--muted);margin:0 0 16px;}

.product-line{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #F1EFE4;}
.product-line:last-child{border-bottom:none;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:15px;font-weight:600;}
.product-unit{font-size:11px;color:var(--muted);margin-top:1px;}
.product-line.has-qty .product-name{color:var(--stamp);}

.stepper{display:flex;align-items:center;}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--well);color:var(--ink);font-size:18px;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.stepper button:first-child{border-radius:11px 0 0 11px;}
.stepper button:last-child{border-radius:0 11px 11px 0;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{width:44px;height:34px;border:1px solid var(--line);border-left:none;border-right:none;background:#fff;font-family:inherit;font-size:15px;font-weight:700;text-align:center;padding:0;-webkit-appearance:none;appearance:none;border-radius:0;}

.review-group{margin-bottom:6px;}
.review-group-label{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:12px 2px 6px;border-bottom:1px solid var(--line);}
.review-line{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #F5F3EA;}
.review-line:last-child{border-bottom:none;}
.review-name{flex:1;font-size:15px;font-weight:600;min-width:0;}
.review-qty{font-size:15px;font-weight:700;white-space:nowrap;}
.review-del{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 2px 2px 8px;cursor:pointer;font-family:inherit;}
.review-del:active{color:var(--stamp);}
.review-total{display:flex;justify-content:space-between;align-items:center;background:#EDEBDF;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;margin:14px 0 16px;}
.review-total span:last-child{color:var(--ink-soft);font-weight:600;}

.prep-item{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;border-bottom:1px solid #F1EFE4;}
.prep-item:last-child{border-bottom:none;}
.prep-check{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:1.5px solid var(--line);background:var(--well);border-radius:8px;cursor:pointer;font-family:inherit;color:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;}
.prep-check:active{background:var(--ink);border-color:var(--ink);color:#fff;}
.prep-body{flex:1;min-width:0;}
.prep-text{font-size:15px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word;}
.prep-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.prep-add{display:flex;flex-direction:column;gap:10px;}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink);}
textarea{min-height:78px;}

.gate{padding-top:52px;}
.gate .mark{width:64px;height:64px;border-radius:20px;background:var(--stamp);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:22px;}
.gate h2{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin:0 0 6px;}
.gate p{font-size:14px;color:var(--muted);margin:0 0 22px;line-height:1.45;}
.gate label{display:block;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.gate input{margin-bottom:16px;}

.done{padding-top:56px;text-align:center;}
.done .tick{width:74px;height:74px;border-radius:50%;background:var(--ink);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
.done h2{font-size:24px;font-weight:800;letter-spacing:-0.3px;margin:0 0 8px;}
.done p{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.5;}

.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:13px;line-height:1.5;}
.footnote{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;}
.footnote button{background:none;border:none;font-family:inherit;font-size:12px;color:var(--ink-soft);font-weight:600;text-decoration:underline;cursor:pointer;padding:0;}
.offline-note{font-size:12px;color:var(--stamp);text-align:center;margin-top:12px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:88%;text-align:center;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

  {id:"p35", name:"Fior di Latte", unit:"kg", cat:"Protein", inc:2},
  {id:"p40", name:"Pepperoni", unit:"box", cat:"Protein", inc:1},
  {id:"p36", name:"Fresh Lasagna Sheets", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p37", name:"Gastronomi Gnocchi", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p38", name:"Squid Ink Spaghetti", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p39", name:"Calamarata Pasta", unit:"kg", cat:"Dry Goods", inc:1}
];
const CATEGORIES = ['Veggies','Protein','Dry Goods'];

/* ====== STATE ====== */
const CART_KEY = 'almo-orders-cart';
const NAME_KEY = 'almo-orders-name';
let cart = {};
let username = '';
let view = 'home';
let currentCategory = null;
let prep = { items: [], loaded:false, loading:false, failed:false };
let sending = false;

function loadLocal(){
  try{ username = localStorage.getItem(NAME_KEY) || ''; }catch(e){ username = ''; }
  try{ const r = localStorage.getItem(CART_KEY); cart = r ? JSON.parse(r) : {}; }catch(e){ cart = {}; }
}
function saveCart(){ try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){} }
function saveName(){ try{ localStorage.setItem(NAME_KEY, username); }catch(e){} }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function prod(id){ return products.find(p => p.id === id); }
function cartItems(){ return Object.entries(cart).filter(([id,q]) => q > 0); }
function cartCount(){ return cartItems().length; }
function round2(n){ return Math.round(n * 100) / 100; }
function timeAgo(ts){
  const mins = Math.floor((Date.now() - ts) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function goto(v, cat){
  view = v;
  if(cat !== undefined) currentCategory = cat;
  try{ history.pushState({view:v, cat:currentCategory}, ''); }catch(e){}
  render();
  window.scrollTo(0,0);
}

/* ====== PREP LIST ====== */
async function fetchPrep(){
  if(prep.loading) return;
  prep.loading = true;
  try{
    const res = await fetch(API + '/api/prep', {cache:'no-store'});
    const data = await res.json();
    prep.items = Array.isArray(data.items) ? data.items : [];
    prep.failed = false;
  }catch(e){
    prep.failed = true;
  }
  prep.loading = false;
  prep.loaded = true;
  if(view === 'prep' || view === 'home') render();
}

async function addPrep(text){
  try{
    const res = await fetch(API + '/api/prep', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: text, by: username })
    });
    if(!res.ok) throw new Error();
    showToast('Added to the prep list');
    await fetchPrep();
    return true;
  }catch(e){
    showToast('No connection. Nothing was added.');
    return false;
  }
}

async function clearPrep(id){
  const before = prep.items;
  prep.items = prep.items.filter(i => i.id !== id);
  render();
  try{
    const res = await fetch(API + '/api/prep/clear', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: id })
    });
    if(!res.ok) throw new Error();
  }catch(e){
    prep.items = before;
    render();
    showToast('No connection. Line is still on the list.');
  }
}

/* ====== SEND ORDER ====== */
async function sendOrder(){
  if(sending) return;
  const items = {};
  cartItems().forEach(([id,q]) => { items[id] = q; });
  if(Object.keys(items).length === 0) return;

  sending = true; render();
  try{
    const res = await fetch(API + '/api/order', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items: items, sender: username })
    });
    if(!res.ok) throw new Error();
    cart = {};
    saveCart();
    sending = false;
    goto('sent');
  }catch(e){
    sending = false;
    render();
    showToast('No connection. Your order has not been sent.');
  }
}

/* ====== RENDER ====== */
function render(){
  const app = document.getElementById('app');
  if(!username){ app.innerHTML = renderGate(); attach(); return; }

  let html = `<div class="brand"><h1>Almo Orders</h1><span class="tag">${esc(username)}</span></div>`;
  if(view === 'home') html += renderHome();
  else if(view === 'categories') html += renderCategories();
  else if(view === 'category') html += renderCategory();
  else if(view === 'review') html += renderReview();
  else if(view === 'sent') html += renderSent();
  else if(view === 'prep') html += renderPrep();
  else html += renderHome();
  app.innerHTML = html;
  attach();
}

function renderGate(){
  return `
    <div class="gate">
      <div class="mark">A</div>
      <h2>Almo Orders</h2>
      <p>Send your orders and prep straight to the kitchen.</p>
      <label for="name-input">Your name</label>
      <input type="text" id="name-input" placeholder="e.g. Anil" autocomplete="given-name" autocapitalize="words">
      <button class="btn" id="gate-go">Get started</button>
    </div>
  `;
}

function renderHome(){
  const n = cartCount();
  const open = prep.items.length;
  return `
    <button class="tile" data-go="categories">
      <div>
        <div class="tile-title">Request an order</div>
        <div class="tile-sub">Veggies · Protein · Dry Goods</div>
        ${n ? `<div class="tile-count">${n} item${n===1?'':'s'} not sent yet</div>` : ''}
      </div>
      <div class="chev">&rsaquo;</div>
    </button>
    <button class="tile" data-go="prep">
      <div>
        <div class="tile-title">Prep list</div>
        <div class="tile-sub">Shared with everyone in the kitchen</div>
        ${prep.loaded && !prep.failed ? `<div class="tile-count">${open ? open + ' line' + (open===1?'':'s') + ' to do' : 'Nothing on it yet'}</div>` : ''}
      </div>
      <div class="chev">&rsaquo;</div>
    </button>
    <div class="footnote">Sending as ${esc(username)}. <button data-change-name="1">Not you?</button></div>
  `;
}

function renderCategories(){
  const n = cartCount();
  let html = `<div class="crumb"><button data-go="home">&larr; Home</button></div>
    <h2 class="screen-title">What do you need?</h2>
    <p class="screen-sub">Pick a section, set your quantities, then review before it goes.</p>`;
  CATEGORIES.forEach(cat => {
    const inCat = products.filter(p => p.cat === cat);
    const picked = inCat.filter(p => (cart[p.id] || 0) > 0).length;
    html += `
      <button class="tile" data-cat="${esc(cat)}">
        <div>
          <div class="tile-title">${esc(cat)}</div>
          <div class="tile-sub">${inCat.length} items</div>
          ${picked ? `<div class="tile-count">${picked} selected</div>` : ''}
        </div>
        <div class="chev">&rsaquo;</div>
      </button>`;
  });
  html += `<div style="margin-top:20px;">
    <button class="btn ${n?'':'ghost'}" id="to-review" ${n?'':'disabled'}>${n ? `Review ${n} item${n===1?'':'s'}` : 'Nothing selected yet'}</button>
  </div>`;
  return html;
}

function renderCategory(){
  const list = products.filter(p => p.cat === currentCategory);
  let html = `<div class="crumb"><button data-go="categories">&larr; All sections</button></div>
    <h2 class="screen-title">${esc(currentCategory)}</h2>
    <p class="screen-sub">Leave anything you don't need at zero.</p>
    <div class="card">`;
  list.forEach(p => {
    const qty = cart[p.id] || 0;
    html += `
      <div class="product-line ${qty>0?'has-qty':''}">
        <div class="product-info">
          <div class="product-name">${esc(p.name)}</div>
          <div class="product-unit">${esc(p.unit)}</div>
        </div>
        <div class="stepper">
          <button data-dec="${p.id}" aria-label="Less ${esc(p.name)}">&minus;</button>
          <input class="qty-input" data-input="${p.id}" value="${qty}" inputmode="decimal" aria-label="${esc(p.name)} quantity">
          <button data-inc="${p.id}" aria-label="More ${esc(p.name)}">+</button>
        </div>
      </div>`;
  });
  html += `</div><div style="margin-top:16px;"><button class="btn" data-go="categories">Done</button></div>`;
  return html;
}

function renderReview(){
  const items = cartItems();
  if(items.length === 0){
    return `<div class="crumb"><button data-go="categories">&larr; Back</button></div>
      <div class="empty">Nothing on this order yet.<br>Go back and add a few things.</div>`;
  }

  let lineCount = 0;
  let groups = '';
  CATEGORIES.forEach(cat => {
    const inCat = items.filter(([id]) => { const p = prod(id); return p && p.cat === cat; });
    if(inCat.length === 0) return;
    lineCount += inCat.length;
    groups += `<div class="review-group"><div class="review-group-label">${esc(cat)}</div>`;
    inCat.forEach(([id, qty]) => {
      const p = prod(id);
      groups += `
        <div class="review-line">
          <div class="review-name">${esc(p.name)}</div>
          <div class="review-qty">${qty} ${esc(p.unit)}</div>
          <button class="review-del" data-remove="${id}" aria-label="Remove ${esc(p.name)}">&times;</button>
        </div>`;
    });
    groups += `</div>`;
  });

  return `
    <div class="crumb"><button data-go="categories">&larr; Keep adding</button></div>
    <h2 class="screen-title">Check it over</h2>
    <p class="screen-sub">This is what the kitchen will see.</p>
    <div class="card">${groups}</div>
    <div class="review-total"><span>${lineCount} line${lineCount===1?'':'s'}</span><span>From ${esc(username)}</span></div>
    <button class="btn" id="send-btn" ${sending?'disabled':''}>${sending ? 'Sending…' : 'Send to kitchen'}</button>
  `;
}

function renderSent(){
  return `
    <div class="done">
      <div class="tick">&#10003;</div>
      <h2>Sent to the kitchen</h2>
      <p>Thanks ${esc(username)}. It'll show up on the head chef's app.</p>
      <button class="btn ghost" data-go="home">Back to home</button>
    </div>
  `;
}

function renderPrep(){
  let body;
  if(!prep.loaded && prep.loading){
    body = `<div class="empty">Loading the prep list…</div>`;
  } else if(prep.failed && prep.items.length === 0){
    body = `<div class="empty">Can't reach the prep list right now.<br>Check your connection and pull down to retry.</div>`;
  } else if(prep.items.length === 0){
    body = `<div class="empty">Nothing on the prep list.<br>Add the first line below.</div>`;
  } else {
    body = prep.items.slice().reverse().map(i => `
      <div class="prep-item">
        <button class="prep-check" data-prep-done="${esc(i.id)}" aria-label="Mark done">&#10003;</button>
        <div class="prep-body">
          <div class="prep-text">${esc(i.text)}</div>
          <div class="prep-meta">${esc(i.by || 'Kitchen')} · ${timeAgo(i.timestamp || Date.now())}</div>
        </div>
      </div>`).join('');
  }

  return `
    <div class="crumb"><button data-go="home">&larr; Home</button></div>
    <h2 class="screen-title">Prep list</h2>
    <p class="screen-sub">Everyone sees the same list. Tick a line off when it's done.</p>
    <div class="card">${body}</div>
    <div class="section-label">Add a line</div>
    <div class="card">
      <div class="prep-add">
        <textarea id="prep-text" placeholder="e.g. 4L napoli, pickle 2kg onions"></textarea>
        <button class="btn" id="prep-add-btn">Add to prep list</button>
      </div>
    </div>
    ${prep.failed ? `<div class="offline-note">Offline. This list may be out of date.</div>` : ''}
  `;
}

/* ====== HANDLERS ====== */
function attach(){
  const gateGo = document.getElementById('gate-go');
  if(gateGo){
    const input = document.getElementById('name-input');
    const commit = ()=>{
      const v = (input.value || '').trim();
      if(!v){ showToast('Pop your name in first'); input.focus(); return; }
      username = v.slice(0,40);
      saveName();
      view = 'home';
      render();
      fetchPrep();
    };
    gateGo.addEventListener('click', commit);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') commit(); });
    setTimeout(()=>input.focus(), 60);
    return;
  }

  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', ()=>{
      const target = el.dataset.go;
      goto(target);
      if(target === 'prep') fetchPrep();
    });
  });

  document.querySelectorAll('[data-cat]').forEach(el => {
    el.addEventListener('click', ()=> goto('category', el.dataset.cat));
  });

  const toReview = document.getElementById('to-review');
  if(toReview) toReview.addEventListener('click', ()=>{ if(cartCount()) goto('review'); });

  document.querySelectorAll('[data-inc]').forEach(b => {
    b.addEventListener('click', ()=>{
      const p = prod(b.dataset.inc);
      cart[b.dataset.inc] = round2((cart[b.dataset.inc] || 0) + (p ? (p.inc || 1) : 1));
      saveCart(); render();
    });
  });
  document.querySelectorAll('[data-dec]').forEach(b => {
    b.addEventListener('click', ()=>{
      const p = prod(b.dataset.dec);
      cart[b.dataset.dec] = Math.max(0, round2((cart[b.dataset.dec] || 0) - (p ? (p.inc || 1) : 1)));
      saveCart(); render();
    });
  });
  document.querySelectorAll('[data-input]').forEach(inp => {
    inp.addEventListener('change', ()=>{
      let v = parseFloat(inp.value);
      if(!isFinite(v) || v < 0) v = 0;
      cart[inp.dataset.input] = round2(v);
      saveCart(); render();
    });
  });

  document.querySelectorAll('[data-remove]').forEach(b => {
    b.addEventListener('click', ()=>{
      delete cart[b.dataset.remove];
      saveCart(); render();
    });
  });

  const sendBtn = document.getElementById('send-btn');
  if(sendBtn) sendBtn.addEventListener('click', sendOrder);

  document.querySelectorAll('[data-prep-done]').forEach(b => {
    b.addEventListener('click', ()=> clearPrep(b.dataset.prepDone));
  });

  const prepAdd = document.getElementById('prep-add-btn');
  if(prepAdd){
    prepAdd.addEventListener('click', async ()=>{
      const ta = document.getElementById('prep-text');
      const text = (ta.value || '').trim();
      if(!text){ showToast('Type what needs prepping'); ta.focus(); return; }
      prepAdd.disabled = true;
      prepAdd.textContent = 'Adding…';
      const ok = await addPrep(text);
      if(ok) ta.value = '';
      const btn = document.getElementById('prep-add-btn');
      if(btn){ btn.disabled = false; btn.textContent = 'Add to prep list'; }
    });
  }

  const changeName = document.querySelector('[data-change-name]');
  if(changeName){
    changeName.addEventListener('click', ()=>{
      username = '';
      saveName();
      render();
    });
  }
}

/* ====== BOOT ====== */
loadLocal();
try{ history.replaceState({view:'home', cat:null}, ''); }catch(e){}
window.addEventListener('popstate', e => {
  const s = e.state || {};
  view = s.view || 'home';
  currentCategory = s.cat || null;
  render();
});
render();
fetchPrep();

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') fetchPrep();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
