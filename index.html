<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Almo Orders</title>
<meta name="theme-color" content="#F1EFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almo Orders">

<!-- PWA manifest with a clean icon -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Almo%20Orders%22%2C%22short_name%22%3A%22Almo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%23F1EFE6%22%2C%22background_color%22%3A%22%23F1EFE6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Bcharset%3Dutf-8%2C%253Csvg%20xmlns%253D%27http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%27%20viewBox%253D%270%200%20100%20100%27%253E%253Ccircle%20cx%253D%2750%27%20cy%253D%2750%27%20r%253D%2748%27%20fill%253D%27%2523A5372F%27%252F%253E%253Ctext%20x%253D%2750%27%20y%253D%2768%27%20text-anchor%253D%27middle%27%20fill%253D%27white%27%20font-size%253D%2748%27%20font-family%253D%27sans-serif%27%253EA%253C%252Ftext%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23A5372F'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='white' font-size='48' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">

<style>
:root{--paper:#F1EFE6;--ink:#262319;--muted:#8A8677;--stamp:#A5372F;--line:#E7E4D7;--card:#FFFFFF;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--paper);font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);margin:0;display:flex;justify-content:center;min-height:100vh;}
#app{width:100%;max-width:460px;padding:16px 16px 46px;}
.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.brand h1{font-size:20px;font-weight:800;margin:0;}
.tag{font-size:10px;color:var(--muted);}
.btn{font-family:inherit;border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;padding:13px 20px;font-size:11px;cursor:pointer;text-transform:uppercase;width:100%;}
.btn:active{background:#000;}
.btn.ghost{background:#EDEBDF;color:#5B584C;border:1px solid var(--line);}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;box-shadow:0 1px 2px rgba(38,35,25,.04),0 8px 22px rgba(38,35,25,.05);}
.tile:active{background:#FBFAF4;}
.tile-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.tile-sub{font-size:11px;color:var(--muted);}
.section-title{font-size:14px;font-weight:800;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.product-line{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid #F1EFE4;gap:8px;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:15px;font-weight:600;}
.product-unit{font-size:11px;color:var(--muted);}
.stepper{display:flex;align-items:center;gap:5px;}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F6F5EE;color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{width:32px;height:34px;border:none;background:transparent;font-size:16px;font-weight:700;text-align:center;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:11px;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.toast.show{opacity:1;}
.review-line{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;}
.review-line .name{font-weight:600;}
.back-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:16px;display:inline-block;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ====== PRODUCT CATALOGUE ======
const products = [
  // VEGGIES
  {id:"p12", name:"Sliced Button Mushroom", unit:"kg", cat:"Veggies", inc:1},
  {id:"p13", name:"Flat White Mushrooms", unit:"kg", cat:"Veggies", inc:1},
  {id:"p14", name:"Green Capsicum", unit:"kg", cat:"Veggies", inc:1},
  {id:"p15", name:"Pineapple", unit:"each", cat:"Veggies", inc:1},
  {id:"p16", name:"Peeled Garlic", unit:"kg", cat:"Veggies", inc:1},
  {id:"p17", name:"Royal Blue Potatoes", unit:"kg", cat:"Veggies", inc:1},
  {id:"p18", name:"Peeled White Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p19", name:"Lemon", unit:"kg", cat:"Veggies", inc:1},
  {id:"p20", name:"Black Garlic", unit:"pkt", cat:"Veggies", inc:1},
  {id:"p21", name:"Chives", unit:"market bunch", cat:"Veggies", inc:1},
  {id:"p22", name:"Red Cherry Tomatoes", unit:"punnet", cat:"Veggies", inc:1},
  {id:"p23", name:"Vine Tomatoes", unit:"kg", cat:"Veggies", inc:1},
  {id:"p24", name:"Rocket", unit:"kg", cat:"Veggies", inc:0.5},
  {id:"p25", name:"Leb. Cucumber", unit:"kg", cat:"Veggies", inc:1},
  {id:"p26", name:"Parsley", unit:"market bunch", cat:"Veggies", inc:1},
  {id:"p27", name:"Salad Burnette", unit:"punnet", cat:"Veggies", inc:1},
  {id:"p28", name:"Spanish Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p29", name:"Brown Onions", unit:"kg", cat:"Veggies", inc:1},
  {id:"p30", name:"Celery", unit:"each", cat:"Veggies", inc:1},
  {id:"p31", name:"Carrots", unit:"kg", cat:"Veggies", inc:1},
  {id:"p32", name:"Rosemary", unit:"bunch", cat:"Veggies", inc:1},
  {id:"p33", name:"Whole Garlic", unit:"kg", cat:"Veggies", inc:0.5},
  {id:"p34", name:"Fennel Bulb", unit:"each", cat:"Veggies", inc:1},
  // PROTEIN
  {id:"p1",  name:"Chicken Thigh", unit:"kg", cat:"Protein", inc:5},
  {id:"p2",  name:"Raw Frozen Prawns", unit:"pkt", cat:"Protein", inc:1},
  {id:"p3",  name:"Loligo Squid", unit:"box", cat:"Protein", inc:1},
  {id:"p4",  name:"Speck", unit:"pkt", cat:"Protein", inc:1},
  {id:"p5",  name:"Beef Mince", unit:"kg", cat:"Protein", inc:1},
  {id:"p6",  name:"Beef Cheeks", unit:"kg", cat:"Protein", inc:1},
  {id:"p7",  name:"Kransky Sausage", unit:"pkt", cat:"Protein", inc:1},
  {id:"p8",  name:"Pork Mince", unit:"kg", cat:"Protein", inc:1},
  {id:"p9",  name:"Italian Style Thick Sausages Mix", unit:"kg", cat:"Protein", inc:1},
  {id:"p10", name:"Mortadella", unit:"kg", cat:"Protein", inc:1},
  {id:"p11", name:"Pork Belly (no bone)", unit:"kg", cat:"Protein", inc:1},
  {id:"p35", name:"Fior di Latte", unit:"kg", cat:"Protein", inc:2},
  {id:"p40", name:"Pepperoni", unit:"box", cat:"Protein", inc:1},
  // DRY GOODS
  {id:"p36", name:"Fresh Lasagna Sheets", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p37", name:"Gastronomi Gnocchi", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p38", name:"Squid Ink Spaghetti", unit:"kg", cat:"Dry Goods", inc:1},
  {id:"p39", name:"Calamarata Pasta", unit:"kg", cat:"Dry Goods", inc:1}
];

// ====== APP STATE ======
let cart = {}; // { productId: quantity }
let view = "home"; // "home", "categories", "category", "review"
let currentCategory = null;
const STORAGE_KEY = 'sous-chef-cart';

function loadCart(){ try{ const r=localStorage.getItem(STORAGE_KEY); cart=r?JSON.parse(r):{}; }catch(e){ cart={}; } }
function saveCart(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }catch(e){} }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function render(){
  const app=document.getElementById('app');
  if(view === "home"){
    app.innerHTML = `
      <div class="brand"><h1>Almo Orders</h1><span class="tag">v1.0</span></div>
      <div class="tile" id="go-request">
        <div class="tile-title">Request Orders</div>
        <div class="tile-sub">Veggies · Dry Goods · Protein</div>
      </div>
    `;
    document.getElementById('go-request').addEventListener('click', ()=>{ view="categories"; render(); });
  }
  else if(view === "categories"){
    const categories = ['Veggies','Dry Goods','Protein'];
    let html = `<div class="brand"><h1>Almo Orders</h1><span class="tag">v1.0</span></div>`;
    html += `<button class="back-btn" id="back-home">&larr; Back</button>`;
    html += `<div style="font-size:16px;font-weight:800;margin-bottom:14px;">Select category</div>`;
    categories.forEach(cat => {
      html += `<div class="tile" data-cat="${cat}" style="margin-bottom:12px;">
        <div class="tile-title">${cat}</div>
        <div class="tile-sub">${products.filter(p=>p.cat===cat).length} items</div>
      </div>`;
    });
    const hasItems = Object.values(cart).some(q=>q>0);
    html += `<div style="margin-top:20px;"><button class="btn ${hasItems?'':'ghost'}" id="review-btn" ${hasItems?'':'disabled'}>Review Order</button></div>`;
    app.innerHTML = html;
    document.getElementById('back-home')?.addEventListener('click', ()=>{ view="home"; render(); });
    document.getElementById('review-btn')?.addEventListener('click', ()=>{ if(hasItems){ view="review"; render(); } });
    document.querySelectorAll('.tile[data-cat]').forEach(tile => {
      tile.addEventListener('click', ()=>{
        currentCategory = tile.dataset.cat;
        view="category";
        render();
      });
    });
  }
  else if(view === "category" && currentCategory){
    const prods = products.filter(p=>p.cat===currentCategory);
    let html = `<div class="brand"><h1>Almo Orders</h1><span class="tag">v1.0</span></div>`;
    html += `<button class="back-btn" id="back-cat">&larr; Back to categories</button>`;
    html += `<div class="section-title">${currentCategory}</div>`;
    prods.forEach(p=>{
      const qty = cart[p.id] || 0;
      html += `
        <div class="product-line">
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-unit">${p.unit}</div>
          </div>
          <div class="stepper">
            <button data-dec="${p.id}">−</button>
            <input class="qty-input" data-input="${p.id}" value="${qty}" inputmode="decimal">
            <button data-inc="${p.id}">+</button>
          </div>
        </div>`;
    });
    html += `<div style="margin-top:20px;"><button class="btn" id="done-cat">Done</button></div>`;
    app.innerHTML = html;
    document.getElementById('back-cat')?.addEventListener('click', ()=>{ view="categories"; render(); });
    document.getElementById('done-cat')?.addEventListener('click', ()=>{ view="categories"; render(); });
    document.querySelectorAll('[data-inc]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id=btn.dataset.inc;
        const prod=products.find(p=>p.id===id);
        const inc=prod?(prod.inc||1):1;
        cart[id]=Math.round(((cart[id]||0)+inc)*100)/100;
        saveCart(); render();
      });
    });
    document.querySelectorAll('[data-dec]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id=btn.dataset.dec;
        const prod=products.find(p=>p.id===id);
        const inc=prod?(prod.inc||1):1;
        cart[id]=Math.max(0, Math.round(((cart[id]||0)-inc)*100)/100);
        saveCart(); render();
      });
    });
    document.querySelectorAll('[data-input]').forEach(input=>{
      input.addEventListener('change', ()=>{
        const id=input.dataset.input;
        let v=parseFloat(input.value);
        if(isNaN(v)||v<0) v=0;
        cart[id]=Math.round(v*100)/100;
        saveCart(); render();
      });
    });
  }
  else if(view === "review"){
    const items = Object.entries(cart).filter(([id,qty])=>qty>0);
    let html = `<div class="brand"><h1>Almo Orders</h1><span class="tag">v1.0</span></div>`;
    html += `<button class="back-btn" id="back-cat-rev">&larr; Back to categories</button>`;
    html += `<div style="font-size:16px;font-weight:800;margin-bottom:14px;">Review your order</div>`;
    if(items.length===0){
      html += `<div style="color:var(--muted);text-align:center;margin:30px 0;">No items selected.</div>`;
    } else {
      html += `<div style="margin-bottom:20px;">`;
      items.forEach(([id,qty])=>{
        const p = products.find(x=>x.id===id);
        html += `<div class="review-line"><span class="name">${p?p.name:id}</span><span>${qty} ${p?p.unit:''}</span></div>`;
      });
      html += `</div>`;
    }
    html += `<button class="btn" id="send-btn" ${items.length===0?'disabled':''}>Send Order to Kitchen</button>`;
    app.innerHTML = html;
    document.getElementById('back-cat-rev')?.addEventListener('click', ()=>{ view="categories"; render(); });
    const sendBtn = document.getElementById('send-btn');
    if(sendBtn && items.length>0){
      sendBtn.addEventListener('click', async ()=>{
        const orderItems = {};
        items.forEach(([id,qty])=>{ orderItems[id]=qty; });
        sendBtn.disabled=true;
        sendBtn.textContent='Sending...';
        try{
          const res=await fetch('https://orders.charlesbobby253.workers.dev/api/order', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({items:orderItems})
          });
          if(res.ok){
            showToast('Order sent!');
            // optionally clear cart after successful send
            // cart = {};
            // saveCart();
          } else {
            showToast('Failed to send');
          }
        } catch(e){
          showToast('No connection');
        }
        sendBtn.disabled=false;
        sendBtn.textContent='Send Order to Kitchen';
      });
    }
  }
}

loadCart();
render();

// Service worker for offline caching
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('data:application/javascript,self.addEventListener(%22install%22,()=>{self.skipWaiting()});self.addEventListener(%22activate%22,()=>{clients.claim()});self.addEventListener(%22fetch%22,(e)=>{e.respondWith(caches.match(e.request).then((r)=>r||fetch(e.request)))})');
  });
}
</script>
</body>
</html>
