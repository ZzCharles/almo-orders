:root{
  --paper:#F1EFE6;--paper-dark:#E7E4D6;--ink:#262319;--ink-soft:#4C483D;
  --muted:#8A8677;--stamp:#A5372F;--stamp-dark:#8B2E2E;--mustard:#B07A22;
  --line:#E7E4D7;--card:#FFFFFF;--well:#F6F5EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:460px;padding:16px 16px 46px;}

.brand{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-0.3px;margin:0;}
.brand .tag{font-size:11px;color:var(--muted);}
.brand-right{display:flex;align-items:center;gap:12px;}
.home-btn{background:none;border:none;padding:0;width:30px;height:30px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.25,.8,.35,1),color .18s ease;}
.home-btn svg{width:21px;height:21px;}
.home-btn:active{transform:scale(.9);color:var(--stamp);}

.crumb{font-size:12px;color:var(--muted);margin-bottom:14px;}
.crumb button{background:none;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:0;cursor:pointer;}
.crumb button:active{color:var(--stamp);}

.btn{font-family:inherit;border:none;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;font-size:11px;padding:14px 20px;width:100%;cursor:pointer;}
.btn:active{background:#000;}
.btn:disabled{opacity:0.4;}
.btn.ghost{background:#EDEBDF;color:#5B584C;}
.btn.ghost:active{background:#E3E0D2;color:var(--ink);}
.btn.danger{background:var(--stamp);}
.btn.danger:active{background:var(--stamp-dark);}

.card,.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(38,35,25,.04),0 8px 22px rgba(38,35,25,.05);}
.tile{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:22px 18px;margin-bottom:12px;font-family:inherit;cursor:pointer;}
.tile:active{background:#FBFAF4;}
.tile-title{font-size:20px;font-weight:800;color:var(--ink);}
.tile-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.tile-count{font-size:12px;font-weight:700;color:var(--stamp);margin-top:4px;}
.chev{color:var(--muted);font-size:18px;}

.card{padding:16px 16px;margin-bottom:12px;}
.card.tight{padding:4px 16px;}
.section-label{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 10px 2px;}
.screen-title{font-size:22px;font-weight:800;letter-spacing:-0.3px;margin:0 0 4px;}
.screen-sub{font-size:13px;color:var(--muted);margin:0 0 16px;}

.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;font-family:inherit;font-size:16px;padding:13px 40px 13px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);}
.search-wrap input:focus{outline:none;border-color:var(--ink);}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-family:inherit;font-size:20px;color:var(--muted);width:32px;height:32px;cursor:pointer;display:none;}
.search-wrap.filled .search-clear{display:block;}

.sec-head{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:16px 2px 7px;border-bottom:1px solid var(--line);}
.sec-head:first-child{padding-top:10px;}
.fn-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.fn-row:last-child{border-bottom:none;}
.fn-row:active{background:#FBFAF4;}
.fn-date{flex:0 0 auto;width:52px;text-align:center;background:#EDEBDF;border-radius:11px;padding:7px 4px;}
.fn-dow{font-size:10px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--stamp);}
.fn-day{font-size:13px;font-weight:800;margin-top:1px;}
.fn-main{flex:1;min-width:0;}
.fn-name{font-size:15.5px;font-weight:700;}
.fn-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.fn-item{display:flex;gap:11px;align-items:baseline;padding:10px 0;border-bottom:1px solid #F5F3EA;}
.fn-item:last-child{border-bottom:none;}
.fn-qty{flex:0 0 auto;min-width:34px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--stamp);}
.fn-label{flex:1;font-size:15px;font-weight:600;line-height:1.35;}
.fn-time{font-weight:800;color:var(--stamp);letter-spacing:0;text-transform:none;font-size:11px;}
.fn-note{font-size:11px;color:var(--muted);font-weight:600;}
.filter-row{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;margin:0 -16px 0;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex:0 0 auto;font-family:inherit;font-size:12px;font-weight:700;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;}
.filter-chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.fc-dot{background:var(--stamp);color:#fff;border-radius:999px;font-size:10px;font-weight:800;min-width:16px;padding:1px 4px;text-align:center;}
.filter-chip.on .fc-dot{background:#fff;color:var(--ink);}
.product-line{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #F5F3EA;}
.product-line:last-child{border-bottom:none;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:15px;font-weight:600;}
.product-unit{font-size:11px;color:var(--muted);margin-top:1px;}
.product-line.has-qty .product-name{color:var(--stamp);}

.stepper{display:flex;align-items:center;}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--well);color:var(--ink);font-size:18px;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.stepper button:first-child{border-radius:11px 0 0 11px;}
.stepper button:last-child{border-radius:0 11px 11px 0;}
.stepper button:active{background:var(--ink);color:#fff;}
.stepper .qty-input{width:44px;height:34px;border:1px solid var(--line);border-left:none;border-right:none;background:#fff;font-family:inherit;font-size:15px;font-weight:700;text-align:center;padding:0;-webkit-appearance:none;appearance:none;border-radius:0;}

.sticky-foot{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(to bottom, rgba(241,239,230,0) 0%, var(--paper) 34%);}

.review-line{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #F5F3EA;}
.review-line:last-child{border-bottom:none;}
.review-name{flex:1;font-size:15px;font-weight:600;min-width:0;}
.review-qty{font-size:15px;font-weight:700;white-space:nowrap;}
.review-del{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 2px 2px 8px;cursor:pointer;font-family:inherit;}
.review-del:active{color:var(--stamp);}
.review-total{display:flex;justify-content:space-between;align-items:center;background:#EDEBDF;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;margin:14px 0 16px;}
.review-total span:last-child{color:var(--ink-soft);font-weight:600;}

.prep-item{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;border-bottom:1px solid #F1EFE4;}
.prep-item:last-child{border-bottom:none;}
.prep-check{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:1.5px solid var(--line);background:var(--well);border-radius:8px;cursor:pointer;font-family:inherit;color:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;}
.prep-check:active{background:var(--ink);border-color:var(--ink);color:#fff;}
.prep-body{flex:1;min-width:0;}
.prep-text{font-size:15px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word;}
.prep-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.prep-item.is-done .prep-text{color:var(--muted);}
.prep-text{position:relative;display:inline-block;}
.prep-item.is-done .prep-text::after{content:'';position:absolute;left:0;top:50%;height:1.5px;background:currentColor;width:100%;
  animation:strike .22s cubic-bezier(.2,.7,.3,1) both;}
@keyframes strike{from{width:0;}to{width:100%;}}
.prep-check{width:44px!important;height:44px!important;margin:-9px 0 -9px -9px!important;border:none!important;background:none!important;
  position:relative;display:flex;align-items:center;justify-content:center;}
.prep-check::before{content:'';position:absolute;width:26px;height:26px;border:1.5px solid var(--line);background:var(--well);border-radius:8px;
  transition:background .18s ease,border-color .18s ease;}
.prep-check.on{color:#fff!important;}
.prep-check.on::before{background:var(--ink);border-color:var(--ink);}
.prep-check:active::before{background:var(--ink);border-color:var(--ink);}
.pick-row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid #F5F3EA;cursor:pointer;}
.pick-row:last-child{border-bottom:none;}
.pick-box{flex:0 0 auto;width:24px;height:24px;border:1.5px solid var(--line);background:var(--well);border-radius:7px;font-size:13px;color:transparent;display:flex;align-items:center;justify-content:center;}
.pick-row.on .pick-box{background:var(--ink);border-color:var(--ink);color:#fff;}
.pick-row.on .pick-name{font-weight:700;}
.pick-name{flex:1;font-size:15px;font-weight:600;min-width:0;}
.pick-row.already{opacity:.5;cursor:default;}
.pick-note{font-size:10.5px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:var(--muted);}
.chev-btn{flex:0 0 auto;width:44px;height:44px;margin:-9px -12px -9px 0;border:none;background:none;font-family:inherit;
  font-size:19px;color:var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.chev-btn:active{color:var(--stamp);}

   View Transitions handles screen changes on browsers that have it; anywhere

@media (prefers-reduced-motion: no-preference){

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const API = 'https://orders.charlesbobby253.workers.dev';
const APP_VERSION = 'v3.2';

/* The product list comes from The Pass via the Worker. This copy is only a
   cold-start fallback for a brand-new install with no connection. */
const FALLBACK = [
  {id:"p5",name:"Beef Mince",unit:"kg",inc:1,cat:"Protein"},
  {id:"p1",name:"Chicken Thigh",unit:"kg",inc:5,cat:"Protein"},
  {id:"p35",name:"Fior di Latte",unit:"kg",inc:2,cat:"Protein"},
  {id:"p18",name:"Peeled White Onions",unit:"kg",inc:1,cat:"Veggies"},
  {id:"p40",name:"Pepperoni",unit:"box",inc:1,cat:"Protein"},
  {id:"p12",name:"Sliced Button Mushroom",unit:"kg",inc:1,cat:"Veggies"}
];
const FALLBACK_CATS = ['Veggies','Protein','Dry Goods'];
const OTHER = 'Everything else';

/* ====== STATE ====== */
const CART_KEY = 'almo-orders-cart';
const NAME_KEY = 'almo-orders-name';
const CAT_KEY  = 'almo-orders-catalogue';
const PREPCAT_KEY = 'almo-orders-prepcat';
const ORDSUB_KEY  = 'almo-orders-last-order-sub';
const TOKEN_KEY   = 'almo-orders-token';
const FAVS_KEY    = 'almo-orders-favs';
const SRECIPES_KEY = 'almo-orders-staff-recipes';
const FUNCS_KEY = 'almo-orders-functions';

let products = FALLBACK.slice();
let categories = FALLBACK_CATS.slice();
let catalogue = { loaded:false, stale:true, timestamp:0 };
let activeCat = null;   // null = show every section
let cart = {};
let username = '';
let view = 'home';
let search = '';
let prepCat = { items:[], sections:[], loaded:false };
let prepLines = [];
let prepPick = {};          // what I'm about to ask the chef for
let prepNote = '';
let prepSearch = '';
let lastOrderSub = null;
let token = '';
let staffId = '';
let signingIn = false;
let authError = '';
let recipes = [];
let recipeSections = [];
let recipesLoaded = false;
let favs = {};
let recipeSearch = '';
let recipeFilter = null;
let currentRecipe = null;
let functions = [];
let tiers = [];
let fnLoaded = false;
let currentFn = null;
let sending = false;

function loadLocal(){
  try{ username = localStorage.getItem(NAME_KEY) || ''; }catch(e){ username = ''; }
  try{ const r = localStorage.getItem(CART_KEY); cart = r ? JSON.parse(r) : {}; }catch(e){ cart = {}; }
  try{
    const raw = localStorage.getItem(CAT_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(Array.isArray(c.products) && c.products.length){
        products = c.products;
        if(Array.isArray(c.categories) && c.categories.length) categories = c.categories;
        catalogue.timestamp = c.timestamp || 0;
        catalogue.loaded = true;
      }
    }
  }catch(e){}
  sortProducts();
  try{
    const pc = localStorage.getItem(PREPCAT_KEY);
    if(pc){ const d = JSON.parse(pc); if(Array.isArray(d.items)){ prepCat.items = d.items; prepCat.sections = d.sections||[]; prepCat.loaded = true; } }
  }catch(e){}
  try{ token = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ token = ''; }
  try{ favs = JSON.parse(localStorage.getItem(FAVS_KEY) || '{}'); }catch(e){ favs = {}; }
  try{
    const sr = localStorage.getItem(SRECIPES_KEY);
    if(sr){ const d = JSON.parse(sr); if(Array.isArray(d.recipes)){ recipes = d.recipes; recipeSections = d.sections||[]; recipesLoaded = true; } }
  }catch(e){}
  try{
    const fj = localStorage.getItem(FUNCS_KEY);
    if(fj){ const d = JSON.parse(fj); if(Array.isArray(d.functions)){ functions = d.functions; tiers = d.tiers||[]; fnLoaded = true; } }
  }catch(e){}
  try{ lastOrderSub = JSON.parse(localStorage.getItem(ORDSUB_KEY) || 'null'); }catch(e){}
}
function saveCart(){ try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){} }
function saveName(){ try{ localStorage.setItem(NAME_KEY, username); }catch(e){} }
function sortProducts(){
  products.sort((a,b)=> String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'}));
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function prod(id){ return products.find(p => p.id === id); }
function cartItems(){
  return Object.entries(cart).filter(([id,q]) => q > 0 && prod(id));
}
function cartCount(){ return cartItems().length; }
function round2(n){ return Math.round(n * 100) / 100; }
function timeAgo(ts){
  const mins = Math.floor((Date.now() - ts) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

/* Wraps a render in a View Transition where supported, so screens cross-fade
   instead of snapping. Falls through untouched everywhere else. */
function animate(fn){
  try{
    if(document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.startViewTransition(fn);
      return;
    }
  }catch(e){}
  fn();
}

function goto(v){
  view = v;
  if(v !== 'order') search = '';
  if(v !== 'recipes' && v !== 'recipe') recipeSearch = '';
  try{ history.pushState({view:v}, ''); }catch(e){}
  animate(render);
  window.scrollTo(0,0);
}

/* ====== CATALOGUE ====== */
async function fetchCatalogue(){
  try{
    const res = await fetch(API + '/api/catalogue', {cache:'no-store', headers: authHeaders()});
    if(res.status === 401){ signedOut(); return; }
    const data = await res.json();
    if(!Array.isArray(data.products) || data.products.length === 0){
      catalogue.stale = true;
      return;
    }
    products = data.products;
    if(Array.isArray(data.categories) && data.categories.length) categories = data.categories;
    sortProducts();
    catalogue.timestamp = data.timestamp || Date.now();
    catalogue.loaded = true;
    catalogue.stale = false;
    try{ localStorage.setItem(CAT_KEY, JSON.stringify({products:products, categories:categories, timestamp:catalogue.timestamp})); }catch(e){}
    if(activeCat && sectionsInUse().indexOf(activeCat) < 0) activeCat = null;

    // drop anything the head chef has since deleted
    let pruned = false;
    Object.keys(cart).forEach(id => { if(!prod(id)){ delete cart[id]; pruned = true; } });
    if(pruned) saveCart();

    render();
  }catch(e){
    catalogue.stale = true;
  }
}

/* ====== PREP LIST ====== */



/* ====== AUTH ====== */
function saveToken(){ try{ token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); }catch(e){} }
function authHeaders(extra){
  const h = Object.assign({}, extra || {});
  if(token) h['X-Staff-Token'] = token;
  return h;
}
function signedOut(){
  token = ''; staffId = ''; saveToken();
  recipes = []; recipesLoaded = false;
  try{ localStorage.removeItem(SRECIPES_KEY); }catch(e){}
  view = 'home';
  render();
}

async function redeemCode(code){
  signingIn = true; authError = ''; render();
  try{
    const res = await fetch(API + '/api/auth/redeem', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: code, device: deviceLabel() })
    });
    const d = await res.json().catch(()=>({}));
    if(!res.ok){
      /* A code written seconds ago may not have reached this phone's edge yet,
         so a miss right after the chef made it is worth one retry. */
      if(res.status === 404){
        await new Promise(r=>setTimeout(r, 2500));
        const again = await fetch(API + '/api/auth/redeem', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ code: code, device: deviceLabel() })
        });
        const d2 = await again.json().catch(()=>({}));
        if(again.ok){ finishSignIn(d2); return; }
      }
      authError = d.error || 'That code did not work';
      signingIn = false; render();
      return;
    }
    finishSignIn(d);
  }catch(e){
    authError = 'No connection. Try again in a moment.';
    signingIn = false; render();
  }
}

function finishSignIn(d){
  token = d.token || '';
  staffId = d.staffId || '';
  username = d.name || username;
  saveToken(); saveName();
  signingIn = false; authError = '';
  view = 'home';
  render();
  fetchCatalogue(); refreshPrep(); fetchRecipes(); fetchFunctions();
}

function deviceLabel(){
  const ua = navigator.userAgent || '';
  if(/iPhone/i.test(ua)) return 'iPhone';
  if(/iPad/i.test(ua)) return 'iPad';
  const m = ua.match(/\(Linux; Android [^;]+; ([^)senger;]+)\)/);
  if(m) return m[1].trim();
  if(/Android/i.test(ua)) return 'Android phone';
  return 'Phone';
}

/* ====== RECIPES ====== */
function saveFavs(){ try{ localStorage.setItem(FAVS_KEY, JSON.stringify(favs)); }catch(e){} }

async function fetchRecipes(){
  if(!token) return;
  try{
    const res = await fetch(API + '/api/staff/recipes', {cache:'no-store', headers: authHeaders()});
    if(res.status === 401){ signedOut(); showToast('Your access was removed'); return; }
    if(!res.ok) throw new Error();
    const d = await res.json();
    if(Array.isArray(d.recipes)){
      recipes = d.recipes;
      recipeSections = Array.isArray(d.sections) ? d.sections : [];
      recipesLoaded = true;
      try{ localStorage.setItem(SRECIPES_KEY, JSON.stringify({recipes:recipes, sections:recipeSections})); }catch(e){}
      Object.keys(favs).forEach(id => { if(!recipes.some(r=>r.id===id)) delete favs[id]; });
      saveFavs();
      if(view === 'recipes' || view === 'home') render();
    }
  }catch(e){}
}

function findRecipe(id){ return recipes.find(r => r.id === id); }
function recipeByName(name){
  const n = String(name||'').trim().toLowerCase();
  return n ? recipes.find(r => String(r.name).trim().toLowerCase() === n) || null : null;
}
function subRecipesOf(r){
  const out = [];
  (r.ingredients||[]).forEach(i => {
    const hit = recipeByName(i.item);
    if(hit && hit.id !== r.id && !out.some(x=>x.id===hit.id)) out.push(hit);
  });
  return out;
}
function usedByRecipes(r){
  return recipes.filter(x => x.id !== r.id &&
    (x.ingredients||[]).some(i => String(i.item).trim().toLowerCase() === String(r.name).trim().toLowerCase()));
}
function fmtAmount(qty, unit){
  const q = Number(qty);
  if(!isFinite(q)) return { amount:'', unit:'' };
  if(unit === 'g' && q >= 1000) return { amount:String(Math.round((q/1000)*1000)/1000), unit:'kg' };
  return { amount:String(Math.round(q*1000)/1000), unit: unit || '' };
}
function recipeSectionsInUse(){
  const used = [];
  recipes.forEach(r => { const s = r.section || 'Other'; if(used.indexOf(s)<0) used.push(s); });
  const ordered = recipeSections.filter(s => used.indexOf(s) > -1);
  used.forEach(s => { if(ordered.indexOf(s)<0) ordered.push(s); });
  return ordered;
}
function sortedRecipes(){
  const order = recipeSectionsInUse();
  return recipes.slice().sort((a,b)=>{
    const fa = favs[a.id]?0:1, fb = favs[b.id]?0:1;
    if(fa !== fb) return fa - fb;
    const ia = order.indexOf(a.section||'Other'), ib = order.indexOf(b.section||'Other');
    if(ia !== ib) return (ia<0?999:ia) - (ib<0?999:ib);
    return String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'});
  });
}

/* ===== Functions =====
   Quantities are rules, not numbers. "1 per 5" against 52 people gives 11, and
   changing the head count re-does every line at once. Always rounds up: a
   kitchen would rather have a spare than be one short. */

const TIER_SEED = [
  { id:'49', label:'$49', items:[
    { id:'i49a', label:'Polenta',        kind:'ratio', per:5, course:'Entrée' },
    { id:'i49b', label:'Salad',          kind:'ratio', per:5, course:'Entrée' },
    { id:'i49c', label:'Calamari',       kind:'ratio', per:5, course:'Entrée' },
    { id:'i49d', label:'Unlimited pizza', kind:'text',        course:'Main' }
  ]},
  { id:'59', label:'$59', items:[
    { id:'i59a', label:'Bruschetta',      kind:'ratio', per:4, course:'Starter' },
    { id:'i59b', label:'Cheese & Garlic', kind:'ratio', per:6, course:'Starter' },
    { id:'i59c', label:'Polenta',         kind:'ratio', per:5, course:'Entrée' },
    { id:'i59d', label:'Salad',           kind:'ratio', per:5, course:'Entrée' },
    { id:'i59e', label:'Calamari',        kind:'ratio', per:5, course:'Entrée' },
    { id:'i59f', label:'Unlimited pizza', kind:'text',         course:'Main' }
  ]},
  { id:'69', label:'$69', items:[
    { id:'i69a', label:'Bruschetta',      kind:'ratio', per:4, course:'Starter' },
    { id:'i69b', label:'Cheese & Garlic', kind:'ratio', per:6, course:'Starter' },
    { id:'i69c', label:'Polenta',         kind:'ratio', per:5, course:'Entrée' },
    { id:'i69d', label:'Salad',           kind:'ratio', per:5, course:'Entrée' },
    { id:'i69e', label:'Calamari',        kind:'ratio', per:5, course:'Entrée' },
    { id:'i69f', label:'Unlimited pizza', kind:'text',         course:'Main' },
    { id:'i69g', label:'Grand Tiramisu',  kind:'fixed', qty:36, perPax:50, course:'Dessert' }
  ]}
];

const COURSE_ORDER = ['Starter','Entrée','Main','Dessert'];

/* Service day, not calendar day: before 5am still counts as last night, so a
   function doesn't vanish off the screen while you're closing down. */
function serviceDateKey(){
  const d = new Date();
  if(d.getHours() < 5) d.setDate(d.getDate() - 1);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

function addDaysKey(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

function fnQty(item, pax){
  if(!item) return '';
  if(item.kind === 'text') return '';
  if(item.kind === 'round'){
    const per = Math.max(1, item.per || 1);
    return Math.ceil((pax||0) / per) + ' per round';
  }
  if(item.kind === 'fixed'){
    if(!item.perPax) return String(item.qty || 0);
    return String((item.qty || 0) * Math.max(1, Math.ceil((pax||0) / item.perPax)));
  }
  const per = Math.max(1, item.per || 1);
  return String(Math.ceil((pax||0) / per));
}

function fnDateLabel(key){
  const d = new Date(key + 'T00:00:00');
  if(isNaN(d)) return key;
  return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' });
}

function sortCourses(courses){
  return (courses||[]).slice().sort((a,b)=>{
    const ia = COURSE_ORDER.indexOf(a.name), ib = COURSE_ORDER.indexOf(b.name);
    const sa = ia < 0 ? 50 : ia, sb = ib < 0 ? 50 : ib;
    if(sa !== sb) return sa - sb;
    return String(a.time||'').localeCompare(String(b.time||''));
  });
}

/* Turns a tier template into the course list for a new function. */
function coursesFromTier(tier){
  if(!tier) return [];
  const byCourse = {};
  (tier.items||[]).forEach(i => {
    const c = i.course || 'Main';
    if(!byCourse[c]) byCourse[c] = [];
    byCourse[c].push(Object.assign({}, i, { id: 'i'+Math.random().toString(36).slice(2,7) }));
  });
  const names = Object.keys(byCourse).sort((a,b)=>{
    const ia = COURSE_ORDER.indexOf(a), ib = COURSE_ORDER.indexOf(b);
    return (ia<0?50:ia) - (ib<0?50:ib);
  });
  return names.map(n => ({ id:'c'+Math.random().toString(36).slice(2,7), name:n, time:'', items:byCourse[n] }));
}

async function fetchFunctions(){
  if(!token) return;
  try{
    const [fr, tr] = await Promise.all([
      fetch(API + '/api/functions', {cache:'no-store', headers: authHeaders()}),
      fetch(API + '/api/tiers', {cache:'no-store', headers: authHeaders()})
    ]);
    if(fr.status === 401){ signedOut(); return; }
    if(fr.ok){
      const d = await fr.json();
      functions = Array.isArray(d.functions) ? d.functions : [];
    }
    if(tr.ok){
      const d = await tr.json();
      tiers = Array.isArray(d.tiers) ? d.tiers : [];
    }
    fnLoaded = true;
    try{ localStorage.setItem(FUNCS_KEY, JSON.stringify({functions:functions, tiers:tiers})); }catch(e){}
    if(view === 'functions' || view === 'home' || view === 'fnView') render();
  }catch(e){}
}

function findFunction(id){ return functions.find(f => f.id === id); }
function upcomingFunctions(){
  const from = serviceDateKey(), to = addDaysKey(14);
  return functions.filter(f => f.date >= from && f.date <= to)
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function tierLabel(id){
  const tr = tiers.find(x => x.id === id);
  return tr ? tr.label : (id ? '$'+id : '');
}

/* See the note in The Pass: a freshly written tick may not show up in the next
   read, so recent local ticks win for a short window. */
const recentTicks = {};
/* Long enough to cover KV catching up, short enough that if someone else
   changes the same line it wins almost straight away. */
const TICK_GRACE = 12000;
function rememberTick(id, done, by){ recentTicks[id] = { done: done, by: by, at: Date.now() }; }
function applyRecentTicks(lines){
  const cutoff = Date.now() - TICK_GRACE;
  return (lines||[]).map(l => {
    const r = recentTicks[l.id];
    if(!r) return l;
    if(r.at < cutoff){ delete recentTicks[l.id]; return l; }
    if(l.done === r.done){ delete recentTicks[l.id]; return l; }
    return Object.assign({}, l, { done: r.done, doneBy: r.done ? r.by : '', doneAt: r.done ? r.at : 0 });
  });
}

async function tickLine(lineId, done){
  const line = prepLines.find(l => l.id === lineId);
  if(!line) return;
  const before = JSON.parse(JSON.stringify(prepLines));
  line.done = done; line.doneBy = done ? username : ''; line.doneAt = done ? Date.now() : 0;
  rememberTick(lineId, done, username);
  render();
  try{
    const res = await fetch(API + '/api/prep/published/tick', {
      method:'POST', headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ id: lineId, by: username, done: done })
    });
    if(!res.ok) throw new Error();
    await res.json().catch(()=>({}));
  }catch(e){
    prepLines = before; render();
    showToast('No connection. Not saved.');
  }
}

async function sendOrder(){
  if(sending) return;
  const items = {};
  cartItems().forEach(([id,q]) => { items[id] = q; });
  if(Object.keys(items).length === 0) return;

  sending = true; render();
  try{
    const res = await fetch(API + '/api/order', {
      method:'POST', headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ items: items, sender: username })
    });
    if(!res.ok) throw new Error();
    try{
      const d = await res.json();
      lastOrderSub = { id: d.id, at: Date.now(), count: Object.keys(items).length, actioned:false };
      saveLastOrderSub();
    }catch(e){}
    cart = {};
    saveCart();
    sending = false;
    goto('sent');
  }catch(e){
    sending = false;
    render();
    showToast('No connection. Your order has not been sent.');
  }
}

function sectionOf(p){
  const c = (p.cat || '').trim();
  return (c && categories.indexOf(c) > -1) ? c : (c || OTHER);
}

/* Sections in the head chef's order, then any stragglers, then the catch-all. */
function sectionsInUse(){
  const used = [];
  products.forEach(p => { const s = sectionOf(p); if(used.indexOf(s) < 0) used.push(s); });
  const ordered = categories.filter(c => used.indexOf(c) > -1);
  used.forEach(s => { if(ordered.indexOf(s) < 0 && s !== OTHER) ordered.push(s); });
  if(used.indexOf(OTHER) > -1) ordered.push(OTHER);
  return ordered;
}

    return `<button type="button" class="filter-chip ${on?'on':''}" data-filter="${val === null ? '' : esc(val)}">${esc(label)}${n?`<span class="fc-dot">${n}</span>`:''}</button>`;

function productListHTML(){
  const q = search.trim().toLowerCase();

  if(q){
    const hits = products.filter(p => String(p.name).toLowerCase().indexOf(q) > -1);
    if(hits.length === 0){
      return `<div class="empty">Nothing matches "${esc(search.trim())}".<br>Ask the kitchen to add it.</div>`;
    }
    return hits.map(rowHTML).join('');
  }

  const secs = sectionsInUse().filter(s => !activeCat || s === activeCat);
  let out = '';
  secs.forEach(s => {
    const inSec = products.filter(p => sectionOf(p) === s);
    if(inSec.length === 0) return;
    if(secs.length > 1 || !activeCat) out += `<div class="sec-head">${esc(s)}</div>`;
    out += inSec.map(rowHTML).join('');
  });
  return out || `<div class="empty">Nothing in this section yet.</div>`;
}

      out += `
        <div class="recipe-row">
          <button class="star ${favs[r.id]?'on':''}" data-fav="${esc(r.id)}" aria-label="${favs[r.id]?'Remove from favourites':'Add to favourites'}">${favs[r.id]?STAR_ON:STAR_OFF}</button>
          <button class="recipe-open" data-open-recipe="${esc(r.id)}">
            <span class="recipe-row-name">${esc(r.name)}</span>
            ${(r.allergens||[]).length ? `<span class="recipe-row-sub">${esc(r.allergens.join(', '))}</span>` : ''}
          </button>
          <span class="chev">&rsaquo;</span>
        </div>`;
    });
    body = out;
  }

  return `
    <div class="crumb"><button data-go="home">&larr; Home</button></div>
    <h2 class="screen-title">Recipes</h2>
    <p class="screen-sub">Tap the star to keep one at the top.</p>
    <div class="search-wrap ${recipeSearch?'filled':''}">
      <input type="text" id="recipe-search" placeholder="Search recipes" value="${esc(recipeSearch)}" autocomplete="off">
      <button class="search-clear" id="recipe-search-clear" aria-label="Clear">&times;</button>
    </div>
    ${chips}
    <div class="card tight">${body}</div>
  `;
}

function renderRecipe(){
  const r = findRecipe(currentRecipe);
  if(!r) return `<div class="crumb"><button data-go="recipes">&larr; Recipes</button></div><div class="empty">Recipe not found.</div>`;

  const ing = (r.ingredients||[]).map(i => {
    const f = fmtAmount(i.qty, i.unit);
    const sub = recipeByName(i.item);
    const cell = sub && sub.id !== r.id
      ? `<button class="ri-link" data-open-recipe="${esc(sub.id)}">${esc(i.item)}<span class="ri-arrow">&rsaquo;</span></button>`
      : esc(i.item);
    return `<tr><td class="ri-amt">${esc(f.amount)}<span class="ri-unit">${esc(f.unit)}</span></td><td class="ri-item">${cell}</td></tr>`;
  }).join('');

  const steps = (r.method||[]).map((s,i)=>`<li><span class="rm-n">${i+1}</span><span class="rm-t">${esc(s)}</span></li>`).join('');
  const subs = subRecipesOf(r);
  const used = usedByRecipes(r);

  return `
    <div class="crumb"><button data-go="recipes">&larr; Recipes</button></div>
    <div class="recipe-head">
      <div class="recipe-top">
        <div class="recipe-eyebrow">${esc(r.section || 'Other')}</div>
        <button class="star big ${favs[r.id]?'on':''}" data-fav="${esc(r.id)}" aria-label="${favs[r.id]?'Remove from favourites':'Add to favourites'}">${favs[r.id]?STAR_ON:STAR_OFF}</button>
      </div>
      <h2 class="recipe-title">${esc(r.name)}</h2>
      ${(r.allergens||[]).length ? `<div class="pill-row">${r.allergens.map(a=>`<span class="pill warn">${esc(a)}</span>`).join('')}</div>` : ''}
      ${subs.length ? `<div class="sub-note">Make first: ${subs.map(s=>`<button class="sub-link" data-open-recipe="${esc(s.id)}">${esc(s.name)}</button>`).join(' &middot; ')}</div>` : ''}
    </div>

    <div class="section-label">Ingredients</div>
    <div class="card tight">${ing ? `<table class="ri-table"><tbody>${ing}</tbody></table>` : '<div class="empty">No ingredients listed.</div>'}</div>

    <div class="section-label">Method</div>
    <div class="card">${steps ? `<ol class="rm-list">${steps}</ol>` : '<div class="empty">No method listed.</div>'}</div>

    ${r.notes ? `<div class="section-label">Handy hints</div><div class="card"><div class="rn-text">${esc(r.notes)}</div></div>` : ''}

    ${used.length ? `<div class="section-label">Used in</div><div class="card tight">${used.map(u=>`
      <div class="recipe-row"><button class="recipe-open" data-open-recipe="${esc(u.id)}"><span class="recipe-row-name">${esc(u.name)}</span></button><span class="chev">&rsaquo;</span></div>`).join('')}</div>` : ''}
  `;
}

const STAR_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.9 5.9 6.1.9-4.5 4.3 1.1 6.4L12 17.5 6.4 20.5l1.1-6.4L3 9.8l6.1-.9Z"/></svg>';
const STAR_ON  = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.9 5.9 6.1.9-4.5 4.3 1.1 6.4L12 17.5 6.4 20.5l1.1-6.4L3 9.8l6.1-.9Z"/></svg>';

function renderPrep(){
  const todo = prepLines.filter(l => !l.done);
  const done = prepLines.filter(l => l.done);

  const row = (l) => `
    <div class="prep-item ${l.done?'is-done':''}">
      <button class="prep-check ${l.done?'on':''}" data-tick="${esc(l.id)}" data-done="${l.done?'1':'0'}" aria-label="${l.done?'Mark not done':'Mark done'}">&#10003;</button>
      <div class="prep-body">
        <div class="prep-text">${esc(l.text)}</div>
        <div class="prep-meta">${l.done
          ? 'Completed by '+esc(l.doneBy||'someone')+(l.doneAt?' · '+timeAgo(l.doneAt):'')
          : 'Added by '+esc(l.by||'someone')}</div>
      </div>
      ${l.recipe && findRecipe(l.recipe) ? `<button class="chev-btn" data-open-recipe="${esc(l.recipe)}" aria-label="Open recipe">&rsaquo;</button>` : ''}
    </div>`;

  const group = (list) => {
    let out = '', lastSec = null;
    list.slice().sort((a,b)=>String(a.section||'Other').localeCompare(String(b.section||'Other'))).forEach(l => {
      const sec = l.section || 'Other';
      if(sec !== lastSec){ lastSec = sec; out += `<div class="sec-head">${esc(sec)}</div>`; }
      out += row(l);
    });
    return out;
  };

  return `
    <div class="crumb"><button data-go="home">&larr; Home</button></div>
    <h2 class="screen-title">Prep list</h2>
    <p class="screen-sub">${todo.length ? todo.length+' to do' : 'Nothing left to do'}${done.length?' · '+done.length+' done':''}</p>
    <div class="card tight">${todo.length ? group(todo) : '<div class="empty">Nothing on the list.<br>Add something below.</div>'}</div>
    <div class="add-row"><button class="btn" data-go="prepAsk">+ Add prep</button></div>
    ${done.length ? `
      <div class="section-label">Completed</div>
      <div class="card tight">${done.slice().reverse().map(row).join('')}</div>
      <div class="sync-line">Only the chef can clear these.</div>` : ''}
  `;
}

function renderPrepAsk(){
  const q = prepSearch.trim().toLowerCase();
  const list = q ? prepCat.items.filter(i => i.name.toLowerCase().indexOf(q) > -1) : prepCat.items;
  const onList = {};
  prepLines.forEach(l => { if(!l.done) onList[String(l.text).toLowerCase()] = true; });
  const n = Object.keys(prepPick).filter(k => prepPick[k]).length;

  let rows;
  if(prepCat.items.length === 0){
    rows = `<div class="empty">Nothing to pick from yet.<br>You can still write a line below.</div>`;
  } else if(list.length === 0){
    rows = `<div class="empty">Nothing matches "${esc(prepSearch.trim())}".<br>Write it below instead.</div>`;
  } else {
    let out = '', lastSec = null;
    list.forEach(i => {
      const sec = i.section || 'Other';
      if(!q && sec !== lastSec){ lastSec = sec; out += `<div class="sec-head">${esc(sec)}</div>`; }
      const already = onList[i.name.toLowerCase()];
      out += `
        <div class="pick-row ${prepPick[i.id]?'on':''} ${already?'already':''}" ${already?'':`data-pick="${esc(i.id)}"`}>
          <span class="pick-box">&#10003;</span>
          <span class="pick-name">${esc(i.name)}</span>
          ${already?'<span class="pick-note">on the list</span>':''}
        </div>`;
    });
    rows = out;
  }

  return `
    <div class="crumb"><button data-go="prep">&larr; Prep list</button></div>
    <h2 class="screen-title">Add prep</h2>
    <p class="screen-sub">Goes straight on the list for everyone.</p>
    <div class="search-wrap ${prepSearch?'filled':''}">
      <input type="text" id="prep-search" placeholder="Search prep items" value="${esc(prepSearch)}" autocomplete="off">
      <button class="search-clear" id="prep-search-clear" aria-label="Clear">&times;</button>
    </div>
    <div class="card tight">${rows}</div>
    <div class="section-label">Anything else</div>
    <div class="card"><textarea id="prep-note" placeholder="A one-off line">${esc(prepNote)}</textarea></div>
    <div class="sticky-foot">
      <button class="btn" id="prep-submit">${n ? 'Add '+n+' item'+(n===1?'':'s') : 'Add to the list'}</button>
    </div>
  `;
}

/* ====== IN-PLACE UPDATES ======
   Stepper taps and typing in the search box patch the DOM instead of
   re-rendering the screen, so the keyboard stays up and the list doesn't jump. */

function refreshList(){
  const holder = document.getElementById('prod-list');
  if(!holder) return;
  const fh = document.getElementById('filter-holder');
  if(fh){ fh.innerHTML = search ? '' : filterChipsHTML(); attachFilterHandlers(); }
  holder.innerHTML = productListHTML();
  attachProductHandlers();
  const wrap = document.querySelector('.search-wrap');
  if(wrap) wrap.classList.toggle('filled', !!search);
}

function attachFilterHandlers(){
  document.querySelectorAll('[data-filter]').forEach(b => {
    b.addEventListener('click', ()=>{
      activeCat = b.dataset.filter || null;
      refreshList();
      const list = document.getElementById('prod-list');
      if(list && list.scrollIntoView) list.scrollIntoView({block:'start'});
    });
  });
}

function refreshFooter(){
  const btn = document.getElementById('to-review');
  if(!btn) return;
  const n = cartCount();
  btn.textContent = reviewLabel();
  btn.disabled = !n;
  btn.classList.toggle('ghost', !n);
}

function setQty(id, value){
  const v = Math.max(0, round2(value));
  if(v === 0) delete cart[id]; else cart[id] = v;
  saveCart();
  const row = document.querySelector('[data-row="' + id + '"]');
  if(row){
    row.classList.toggle('has-qty', v > 0);
    const input = row.querySelector('[data-input]');
    if(input && document.activeElement !== input) input.value = v;
  }
  refreshFooter();
  const fh = document.getElementById('filter-holder');
  if(fh && !search){ fh.innerHTML = filterChipsHTML(); attachFilterHandlers(); }
}

/* ====== HANDLERS ====== */
function attachProductHandlers(){
  document.querySelectorAll('[data-inc]').forEach(b => {
    b.addEventListener('click', ()=>{
      const p = prod(b.dataset.inc);
      setQty(b.dataset.inc, (cart[b.dataset.inc] || 0) + (p ? (p.inc || 1) : 1));
    });
  });
  document.querySelectorAll('[data-dec]').forEach(b => {
    b.addEventListener('click', ()=>{
      const p = prod(b.dataset.dec);
      setQty(b.dataset.dec, (cart[b.dataset.dec] || 0) - (p ? (p.inc || 1) : 1));
    });
  });
  document.querySelectorAll('[data-input]').forEach(inp => {
    inp.addEventListener('change', ()=>{
      let v = parseFloat(inp.value);
      if(!isFinite(v) || v < 0) v = 0;
      setQty(inp.dataset.input, v);
      inp.value = cart[inp.dataset.input] || 0;
    });
  });
}

function attach(){
  const gateGo = document.getElementById('gate-go');
  if(gateGo){
    const input = document.getElementById('code-input');
    const commit = ()=>{
      const v = (input.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
      if(v.length < 4){ authError = 'That code looks too short'; render(); return; }
      redeemCode(v);
    };
    gateGo.addEventListener('click', commit);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') commit(); });
    input.addEventListener('input', ()=>{
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
    });
    setTimeout(()=>input.focus(), 60);
    return;
  }

  document.querySelectorAll('[data-signout]').forEach(b => {
    b.addEventListener('click', ()=>{
      if(!confirm('Sign out of this phone? You will need a new code to get back in.')) return;
      signedOut();
    });
  });

  document.querySelectorAll('[data-fav]').forEach(b => {
    b.addEventListener('click', ()=>{
      const id = b.dataset.fav;
      if(favs[id]) delete favs[id]; else favs[id] = 1;
      saveFavs();
      render();
    });
  });

  document.querySelectorAll('[data-open-fn]').forEach(b => {
    b.addEventListener('click', ()=>{ currentFn = b.dataset.openFn; goto('fnView'); });
  });

  document.querySelectorAll('[data-open-recipe]').forEach(b => {
    b.addEventListener('click', ()=>{ currentRecipe = b.dataset.openRecipe; goto('recipe'); });
  });

  document.querySelectorAll('[data-rfilter]').forEach(b => {
    b.addEventListener('click', ()=>{ recipeFilter = b.dataset.rfilter || null; render(); });
  });

  const rSearch = document.getElementById('recipe-search');
  if(rSearch){
    rSearch.addEventListener('input', ()=>{
      recipeSearch = rSearch.value;
      const pos = rSearch.selectionStart;
      render();
      const again = document.getElementById('recipe-search');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  const rClear = document.getElementById('recipe-search-clear');
  if(rClear) rClear.addEventListener('click', ()=>{ recipeSearch=''; render(); });

  document.querySelectorAll('[data-tick]').forEach(b => {
    b.addEventListener('click', ()=> tickLine(b.dataset.tick, b.dataset.done !== '1'));
  });

  document.querySelectorAll('[data-pick]').forEach(row => {
    row.addEventListener('click', ()=>{
      const note = document.getElementById('prep-note');
      if(note) prepNote = note.value;
      const id = row.dataset.pick;
      if(prepPick[id]) delete prepPick[id]; else prepPick[id] = true;
      render();
    });
  });

  const pSearch = document.getElementById('prep-search');
  if(pSearch){
    pSearch.addEventListener('input', ()=>{
      const note = document.getElementById('prep-note');
      if(note) prepNote = note.value;
      prepSearch = pSearch.value;
      const pos = pSearch.selectionStart;
      render();
      const again = document.getElementById('prep-search');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  const pClear = document.getElementById('prep-search-clear');
  if(pClear){
    pClear.addEventListener('click', ()=>{
      const note = document.getElementById('prep-note');
      if(note) prepNote = note.value;
      prepSearch = '';
      render();
    });
  }

  const pNote = document.getElementById('prep-note');
  if(pNote) pNote.addEventListener('change', ()=>{ prepNote = pNote.value; });

  const pSubmit = document.getElementById('prep-submit');
  if(pSubmit){
    pSubmit.addEventListener('click', async ()=>{
      const note = document.getElementById('prep-note');
      if(note) prepNote = note.value;
      const lines = prepCat.items.filter(i => prepPick[i.id])
        .map(i => ({ text:i.name, section:i.section||'Other', recipe:i.recipe||'' }));
      const extra = prepNote.trim();
      if(extra) lines.push({ text: extra, section:'Anything else', recipe:'' });
      if(lines.length === 0){ showToast('Pick something first'); return; }
      pSubmit.disabled = true; pSubmit.textContent = 'Adding…';
      const ok = await addPrepLines(lines);
      if(!ok){ pSubmit.disabled = false; pSubmit.textContent = 'Add to the list'; return; }
      prepPick = {}; prepNote = '';
      goto('prep');
      showToast('Added to the list');
    });
  }

  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', ()=>{
      const target = el.dataset.go;
      goto(target);
      if(target === 'prep' || target === 'prepAsk') refreshPrep();
      if(target === 'order') fetchCatalogue();
      if(target === 'recipes') fetchRecipes();
      if(target === 'functions') fetchFunctions();
    });
  });

  attachProductHandlers();
  attachFilterHandlers();

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{ search = searchInput.value; refreshList(); });
  }
  const searchClear = document.getElementById('search-clear');
  if(searchClear){
    searchClear.addEventListener('click', ()=>{
      search = '';
      const si = document.getElementById('search-input');
      if(si){ si.value = ''; si.focus(); }
      refreshList();
    });
  }

  const toReview = document.getElementById('to-review');
  if(toReview) toReview.addEventListener('click', ()=>{ if(cartCount()) goto('review'); });

  document.querySelectorAll('[data-remove]').forEach(b => {
    b.addEventListener('click', ()=>{
      delete cart[b.dataset.remove];
      saveCart(); render();
    });
  });

  const sendBtn = document.getElementById('send-btn');
  if(sendBtn) sendBtn.addEventListener('click', sendOrder);



}

/* ====== BOOT ====== */
loadLocal();
try{ history.replaceState({view:'home'}, ''); }catch(e){}
window.addEventListener('popstate', e => {
  view = (e.state && e.state.view) || 'home';
  search = '';
  render();
});
render();
if(token){ fetchCatalogue(); refreshPrep(); fetchRecipes(); fetchFunctions(); }

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){ fetchCatalogue(); refreshPrep(); fetchRecipes(); fetchFunctions(); }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
